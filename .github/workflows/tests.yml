name: tests

# Runs each skill's test suite. The live checks, which read real Claude Code
# transcripts under ~/.claude/projects, skip themselves here, because CI has
# none. The fixture tests are what catch regressions in the scripts.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18 or later runs gh-link.test.ts directly, by stripping its types.
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: export-md (claude-to-md.mjs)
        run: node --test skills/export-md/tests/claude-to-md.test.mjs

      - name: find-past-conversations (list-claude-conversations.py)
        run: python3 -I -B -m unittest discover -s skills/find-past-conversations/tests -v

      - name: linking-to-code (gh-link)
        run: node --test skills/linking-to-code/tests/gh-link.test.ts
